version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: lensenticai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lensenticai
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: lensenticai_redis
    ports:
      - "6379:6379"

  backend:
    build: ./docker/backend
    container_name: lensenticai_backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./docker/frontend
    container_name: lensenticai_frontend
    ports:
      - "5173:5173"